## GhostTalk — Configuração do Render
## Deploy automático: servidor backend + cliente frontend estático

services:
  # ----------------------------------------------------------------
  # Backend — Node.js
  # ----------------------------------------------------------------
  - type: web
    name: ghosttalk-servidor
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: MAX_FILE_SIZE
        value: 5242880
      - key: LOGIN_MAX_ATTEMPTS
        value: 5
      - key: LOGIN_WINDOW_MS
        value: 60000
      - key: CLEANUP_INTERVAL_MS
        value: 3600000
      # As variáveis abaixo você preenche manualmente no painel do Render:
      # MONGODB_URI, JWT_SECRET, JWT_REFRESH_SECRET, CLIENT_URL

  # ----------------------------------------------------------------
  # Frontend — React (site estático)
  # ----------------------------------------------------------------
  - type: web
    name: ghosttalk-cliente
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # Redireciona todas as rotas para index.html (React Router)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: ghosttalk-servidor
          type: web
          property: host
